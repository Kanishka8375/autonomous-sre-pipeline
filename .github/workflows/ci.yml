name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    
    - name: Set up Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio pytest-httpserver mypy
        
    - name: Run MyPy type checking
      run: |
        PYTHONPATH=. mypy --strict sre_pipeline/ tests/
        
    - name: Run Pytest
      run: |
        PYTHONPATH=. pytest tests/ -v
